# HSTS configuration for the TLS-terminating edge proxy.
#
# This file is NOT included by nginx.conf (which serves plain HTTP).
# Include it at the edge terminator that actually serves HTTPS traffic.
#
# Usage (edge nginx):
#   server {
#       listen 443 ssl http2;
#       ...
#       include /path/to/hsts.conf;
#   }
#
# max-age=63072000 (2 years) is the maximum value accepted by HSTS preload
# lists. includeSubDomains covers all subdomains under this origin.
# preload enables submission to browser HSTS preload lists.
#
# Without HSTS, a man-in-the-middle can perform an SSL stripping attack on
# the client's first connection (or after the HSTS max-age expires).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
# Secret and hygiene gate.
#
# This repository had no CI at all until this workflow. That is worth stating
# plainly, because it is the root cause of a whole class of finding rather than
# a matter of carelessness: without a gate, a one-time scrub regresses the next
# time someone pastes a token into a fixture.
#
# The scan is configured by .gitleaks.toml, which adds rules for the credential
# format this platform MINTS ITSELF (`a2a_` + token_urlsafe(32),
# models/phase_c.py:370). Stock gitleaks cannot know that prefix, so a leaked
# partner API key would pass a default scan silently.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret deleted in the PR head may still be reachable
          # in an earlier commit of the same branch.
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        env:
          # Pinned deliberately. `latest` would let an upstream rule change turn
          # a green gate red — or worse, red to green — with no commit here.
          # This is the version .gitleaks.toml was verified against; bump the
          # two together, never the pin alone.
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree (blocking)
        run: gitleaks detect --no-git --config .gitleaks.toml --redact --verbose

      # BLOCKING over ALL history, which is unusual and deserves the note.
      #
      # This repository's history is clean — verified at 73d0622 across all
      # commits — because it was published fresh rather than carrying an older
      # tree forward. That makes a full-history gate affordable here, where on a
      # repository with legacy leaks it would fail every PR forever and get
      # deleted rather than fixed.
      #
      # If history is ever rewritten or an older tree is grafted on, expect this
      # step to be the one that fails, and rotate rather than allowlist.
      - name: Scan full history (blocking)
        run: gitleaks detect --config .gitleaks.toml --redact --verbose

      # NON-BLOCKING, and deliberately so.
      #
      # scripts/ci/hygiene-check.sh currently reports 15 broken relative links,
      # all of them pointing at files that left the tree when the certification
      # stacks . None is a
      # secret or a hygiene regression; they are stale references.
      #
      # It runs anyway because its OTHER checks — tracked .env files, internal
      # hostnames, third-party marks — are the ones that matter here, and a
      # check nobody runs is a check that does not exist. Flip to blocking in
      # the same commit that fixes the links; do not flip it by allowlisting
      # them.
      - name: Repository hygiene gate (advisory — 15 known broken links)
        continue-on-error: true
        run: bash scripts/ci/hygiene-check.sh

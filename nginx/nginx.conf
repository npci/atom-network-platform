# ═══════════════════════════════════════════════════════════════════════════
# ATOM A2A Platform — outer nginx
#
# A2A security hardening — TLS termination.
#   * Port 80 redirects to 443 with HSTS preload semantics
#   * Port 443 runs the actual proxy with TLS 1.2+ ciphers
#   * Certs: put server.crt + server.key (and clients-ca.crt, for the :8443
#     mTLS tier) in the host directory bound to /etc/nginx/ssl — the bind is
#     declared in docker-compose.prod.yml as ${NGINX_SSL_DIR:-./nginx/ssl}.
#     Renew in place with `certbot renew --webroot -w /var/www/certbot`; the
#     :80 server block below serves the ACME challenge from that same path.
#
# The mTLS-tier server block on :8443 uses the same TLS config as :443 but adds
# `ssl_verify_client on` against the authority's clients-CA bundle. nginx
# forwards $ssl_client_fingerprint as X-Client-Cert-Fingerprint; the backend's
# SdkAuthMiddleware compares against `partner_agents.client_cert_fingerprint`
# for partners with `tls_tier='mtls'`. Every other partner tier stays on :443.
#
# A per-partner rate-limit zone keyed on $http_authorization is declared below.
# ═══════════════════════════════════════════════════════════════════════════

server_tokens off;

# KEEP IN SYNC with frontend/nginx.conf.template's Content-Security-Policy.
#
# The SPA response passes through BOTH layers, so it carries two CSP headers and
# the browser enforces their INTERSECTION — the strictest value of each
# directive, not the last one written. A directive present here but absent (or
# looser) there silently tightens the effective policy, and the symptom is a
# feature that works when the frontend container is hit directly and breaks only
# behind the proxy. The earlier value here was narrower than the app needs
# (no worker-src, no blob:, img-src without https:), which would have blocked
# the regex-tester worker, the sandboxed prototype-preview frames and an
# external VITE_BRAND_LOGO_URL once the frontend gained its own policy.
#
# Keeping the two byte-identical makes the intersection equal to the intended
# policy. See frontend/nginx.conf.template for the per-directive rationale.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;

upstream atom_backend {
    server backend:8000;
}

upstream atom_frontend {
    server frontend:80;
}

# The partner platform is a SEPARATE compose stack — see the "Partner Platform"
# note in docker-compose.prod.yml: it deploys from its own repository and there
# is nothing to co-deploy here.
#
# So it must NOT get `upstream` blocks. nginx resolves every upstream host AT
# STARTUP, and a single unresolvable name is fatal to the WHOLE proxy, not just
# to its own routes — the authority API and UI go down with it. This file
# originally declared `upstream partner_backend` / `partner_frontend`;
# nginx.dev.conf.template hit precisely that outage ('host not found in
# upstream') and was trimmed for it. Its fix is reproduced here.
#
# Instead the partner routes resolve per-request through Docker's embedded DNS
# using a variable in `proxy_pass`. Partner absent => 502 on the partner routes
# only; everything else keeps serving.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;


# ───────────────────────────────────────────────────────────────────────────
# Per-partner rate-limit zone.
#
# Keyed on $http_authorization so each partner's Bearer token gets its
# own bucket — partner A's burst doesn't impact partner B. Anonymous
# requests (no Authorization header) all share a single bucket; that's
# fine because they'll be rejected by the auth middleware downstream
# anyway.
#
# 10MB shared zone holds ~80k distinct keys. 100 req/s is a generous
# baseline (the tightest network partner today peaks ~30 req/s). Burst 200
# with `nodelay` lets short spikes through without queueing — bursts
# above that get an immediate 429 instead of a backed-up queue eating
# the request timeout.
#
# `partner_agents.rate_limit_rps` is a per-partner override column
# stored on the DB but NOT consumed by nginx today (would need
# njs/Lua for dynamic zone-rate). A later change may wire it; for now
# the flat 100r/s is the cap, with the column reserved.
# ───────────────────────────────────────────────────────────────────────────
limit_req_zone $http_authorization zone=partner_rl:10m rate=100r/s;

# Anonymous-endpoint limiter, keyed on CLIENT IP rather than the Authorization
# header. partner_rl keys on $http_authorization, which is EMPTY on an
# unauthenticated POST /auth/login — so every anonymous login attempt on the
# planet shares one bucket, and the limit does not bind per-client. Brute force
# is already blocked by the app-level lockout + CAPTCHA; this is the missing
# defence-in-depth layer in front of them. 10r/s sustained is far above a human
# typing a password and far below a credential-stuffing run.
limit_req_zone $binary_remote_addr zone=login_rl:10m rate=10r/s;


# ───────────────────────────────────────────────────────────────────────────
# HTTP :80 — redirect everything to HTTPS, except the well-known ACME
# challenge path (so certbot can renew the cert in-place).
# ───────────────────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    # certbot-style ACME challenge: served plain HTTP from a known directory.
    # Keep this BEFORE the redirect so renewal works without manual intervention.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ───────────────────────────────────────────────────────────────────────────
# HTTPS :443 — primary proxy. All four upstream paths from the original
# nginx.conf moved verbatim under this server block; only TLS + headers
# change.
# ───────────────────────────────────────────────────────────────────────────
server {
    listen              443 ssl;
    http2               on;
    server_name         _;
    client_max_body_size 50M;

    # ── TLS cert + key ───────────────────────────────────────────────────
    # Mounted by docker-compose.prod.yml at /etc/nginx/ssl/. Self-signed is
    # acceptable for dev / internal-network testing; production must use the
    # authority's internal CA, or certbot against the :80 ACME location above.
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # ── TLS version + cipher policy (Mozilla "intermediate" 2025) ────────
    # No SSLv3, no TLS 1.0/1.1. ChaCha20 prioritised for mobile clients;
    # AES-GCM for desktop. Drops every cipher with known weakness.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Post-quantum key exchange (hybrid) ───────────────────────────────
    # X25519MLKEM768 is a HYBRID: X25519 and ML-KEM-768 are both run and their
    # secrets combined, so the session stays secure if EITHER holds. It closes
    # the "harvest now, decrypt later" window — traffic captured today cannot be
    # decrypted by a future quantum computer — while losing nothing classically.
    #
    # Ordered first, with X25519 and secp384r1 behind it as fallbacks. Clients
    # that do not offer the hybrid group simply negotiate one of those; VERIFIED
    # against OpenSSL 1.1.1w, which predates ML-KEM entirely and completes both
    # TLS 1.3 and TLS 1.2 handshakes here unchanged.
    #
    # Only the KEY EXCHANGE is post-quantum. The certificate is still RSA and
    # its signature is not PQC — that needs a CA issuing ML-DSA, which no public
    # CA does yet. Revisit when one does.
    ssl_ecdh_curve      X25519MLKEM768:X25519:secp384r1;

    # ── Session cache + tickets ──────────────────────────────────────────
    # 10MB shared cache ≈ 40k sessions; 1d timeout. Tickets disabled —
    # they'd defeat forward secrecy across nginx restarts.
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # ── HSTS + headers ───────────────────────────────────────────────────
    # 1y max-age; preload-eligible. Includes subdomains so /a2a-partner is
    # covered too. Browsers cache this — flip preload only once you are certain
    # every authority subdomain serves HTTPS, otherwise users get locked out.
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "DENY" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # ── Root redirect ────────────────────────────────────────────────────
    location = / {
        return 302 /a2a/;
    }

    # ══════════════════════════════════════════════════════════════════════
    # A2A protocol surface — exposed at ROOT
    # Partner deployments use these via AUTHORITY_BASE_URL=https://a2a.authority.example
    # The /a2a/* routes below are the admin UI; the root routes here are
    # the partner-facing A2A contract per the rollout doc convention.
    # No path rewrite — atom_backend serves these at the same paths.
    # ══════════════════════════════════════════════════════════════════════

    location /.well-known/ {
        proxy_pass http://atom_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
    }

    location /a2a-rpc/ {
        # Per-partner rate limit on the SDK mount itself.
        limit_req zone=partner_rl burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://atom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/a2a/ {
        # Auth handshake + partner-facing task/thread reads. Same rate
        # limit as the SDK mount.
        limit_req zone=partner_rl burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://atom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ══════════════════════════════════════════════════════════════════════
    # The Authority Platform — /a2a/*
    # ══════════════════════════════════════════════════════════════════════

    # The Authority Agent Card
    location /a2a/.well-known/ {
        rewrite ^/a2a/(.*)$ /$1 break;
        proxy_pass http://atom_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
    }

    # The Authority WebSocket streams
    location /a2a/api/ws/ {
        rewrite ^/a2a/(.*)$ /$1 break;
        proxy_pass http://atom_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "Upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
        proxy_read_timeout 86400s;
    }

    # The Authority SSE log stream
    location /a2a/api/logs/stream {
        rewrite ^/a2a/(.*)$ /$1 break;
        proxy_pass http://atom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
        proxy_set_header Connection        '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Authentication endpoints — per-IP limit (see login_rl above). Declared
    # BEFORE /a2a/api/ so nginx's longest-prefix match selects it for logins.
    location /a2a/api/auth/ {
        limit_req zone=login_rl burst=20 nodelay;
        limit_req_status 429;

        rewrite ^/a2a/(.*)$ /$1 break;
        proxy_pass http://atom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Authority Backend API
    location /a2a/api/ {
        # Per-partner rate limit. burst=200 with nodelay
        # absorbs short spikes; sustained > 100 req/s gets 429.
        limit_req zone=partner_rl burst=200 nodelay;
        limit_req_status 429;

        rewrite ^/a2a/(.*)$ /$1 break;
        proxy_pass http://atom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # The Authority Frontend
    location /a2a/ {
        proxy_pass http://atom_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
        proxy_cache_bypass $http_upgrade;
    }

    # ══════════════════════════════════════════════════════════════════════
    # Partner Platform — /a2a-partner/*
    # ══════════════════════════════════════════════════════════════════════

    # Partner Backend API + A2A
    location /a2a-partner/api/ {
        # Same per-partner rate limit on the partner side.
        limit_req zone=partner_rl burst=200 nodelay;
        limit_req_status 429;

        set $partner_api partner_backend:8001;
        rewrite ^/a2a-partner/(.*)$ /$1 break;
        proxy_pass http://$partner_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
        proxy_read_timeout 300s;
    }

    # Partner Agent Card
    location /a2a-partner/.well-known/ {
        set $partner_card partner_backend:8001;
        rewrite ^/a2a-partner/(.*)$ /$1 break;
        proxy_pass http://$partner_card;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
    }

    # Partner Frontend
    location /a2a-partner/ {
        set $partner_ui partner_frontend:80;
        proxy_pass http://$partner_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";
        proxy_cache_bypass $http_upgrade;
    }
}


# ───────────────────────────────────────────────────────────────────────────
# HTTPS :8443 — mTLS-tier ingress (A2A security hardening)
#
# Partners on the mTLS tier present a pinned client certificate; nginx verifies
# it against the authority's clients-CA bundle and forwards the SHA-256
# fingerprint to the backend, which matches it against
# `partner_agents.client_cert_fingerprint`.
#
# Why a separate port (not the same :443 with conditional verify):
#   * `ssl_verify_client optional` would pass nameless requests through
#     and require Lua / njs to enforce based on the partner header. A
#     dedicated port enforces unconditionally — mTLS-tier partners call :8443, every
#     other tier stays on :443. Simpler and provably correct.
#   * Cert revocation lists (CRL) and OCSP stapling can be tuned here
#     without affecting the public :443 surface.
#
# Operator pre-reqs — all three live in the host directory bound to
# /etc/nginx/ssl by docker-compose.prod.yml:
#   /etc/nginx/ssl/server.crt        — server cert (same as :443)
#   /etc/nginx/ssl/server.key        — server key  (same as :443)
#   /etc/nginx/ssl/clients-ca.crt    — CA bundle issuing partner client certs
#                                      (the authority's internal CA in production)
# ───────────────────────────────────────────────────────────────────────────
server {
    listen              8443 ssl;
    http2               on;
    server_name         _;
    client_max_body_size 50M;

    # Server-side TLS — identical to :443 so partners see the same cert.
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ── Post-quantum key exchange (hybrid) ───────────────────────────────
    # X25519MLKEM768 is a HYBRID: X25519 and ML-KEM-768 are both run and their
    # secrets combined, so the session stays secure if EITHER holds. It closes
    # the "harvest now, decrypt later" window — traffic captured today cannot be
    # decrypted by a future quantum computer — while losing nothing classically.
    #
    # Ordered first, with X25519 and secp384r1 behind it as fallbacks. Clients
    # that do not offer the hybrid group simply negotiate one of those; VERIFIED
    # against OpenSSL 1.1.1w, which predates ML-KEM entirely and completes both
    # TLS 1.3 and TLS 1.2 handshakes here unchanged.
    #
    # Only the KEY EXCHANGE is post-quantum. The certificate is still RSA and
    # its signature is not PQC — that needs a CA issuing ML-DSA, which no public
    # CA does yet. Revisit when one does.
    ssl_ecdh_curve      X25519MLKEM768:X25519:secp384r1;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # ── Client cert verification ────────────────────────────────────────
    # `on` rejects every request that doesn't present a valid client
    # cert. Cert must chain to a CA in clients-ca.crt. Verification
    # depth 2 covers root → intermediate → leaf.
    ssl_client_certificate /etc/nginx/ssl/clients-ca.crt;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    # Stricter security headers for the mTLS-only port.
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "DENY" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;

    # mTLS-tier partners only call the A2A surface — block everything else early so
    # an mTLS-authed partner can't poke other endpoints.
    location = / {
        return 404;
    }

    # ── A2A endpoints (authority-side partner inbound) ──────────────────────────
    # Forward $ssl_client_fingerprint as X-Client-Cert-Fingerprint;
    # SdkAuthMiddleware reads this and matches against the registered
    # value. SHA-256 hex form (the protocol-default).

    # Root-URL A2A surface (partner-facing per the rollout-doc convention).
    location /.well-known/ {
        proxy_pass http://atom_backend;
        proxy_set_header Host                       $host;
        proxy_set_header X-Real-IP                  $remote_addr;
        proxy_set_header X-Forwarded-Proto          $scheme;
        proxy_set_header X-Client-Cert-Fingerprint  $ssl_client_fingerprint;
    }

    location /a2a-rpc/ {
        limit_req zone=partner_rl burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://atom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host                       $host;
        proxy_set_header X-Real-IP                  $remote_addr;
        proxy_set_header X-Forwarded-For            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto          $scheme;
        proxy_set_header X-Client-Cert-Fingerprint  $ssl_client_fingerprint;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/a2a/ {
        limit_req zone=partner_rl burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://atom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host                       $host;
        proxy_set_header X-Real-IP                  $remote_addr;
        proxy_set_header X-Forwarded-For            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto          $scheme;
        proxy_set_header X-Client-Cert-Fingerprint  $ssl_client_fingerprint;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Legacy /a2a/* routes — kept for back-compat with partners on the
    # prefixed contract.
    location /a2a/.well-known/ {
        rewrite ^/a2a/(.*)$ /$1 break;
        proxy_pass http://atom_backend;
        proxy_set_header Host                       $host;
        proxy_set_header X-Real-IP                  $remote_addr;
        proxy_set_header X-Forwarded-Proto          $scheme;
        proxy_set_header X-Client-Cert-Fingerprint  $ssl_client_fingerprint;
    }

    location /a2a/api/ {
        # Same rate-limit zone applies on the mTLS ingress.
        limit_req zone=partner_rl burst=200 nodelay;
        limit_req_status 429;

        rewrite ^/a2a/(.*)$ /$1 break;
        proxy_pass http://atom_backend;
        proxy_http_version 1.1;
        proxy_set_header Host                       $host;
        proxy_set_header X-Real-IP                  $remote_addr;
        proxy_set_header X-Forwarded-For            $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto          $scheme;
        proxy_set_header X-Client-Cert-Fingerprint  $ssl_client_fingerprint;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

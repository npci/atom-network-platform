# Database-only Docker Compose — for native (non-Docker) deployments
#
# Only PostgreSQL + Redis run in Docker. Everything else runs natively.
#
# Usage:
#   docker compose -f docker-compose.db.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atom_user
      # Require an explicit password instead of a repository-published default.
      # Set POSTGRES_PASSWORD in a local .env file or export it before starting compose.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: atom_cm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback-bound, matching docker-compose.yml. Publishing on 0.0.0.0
      # exposes the datastore to every host on the network.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atom_user -d atom_cm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atom_redis
    restart: unless-stopped
    # Redis is the Celery broker: anyone who can write to it can enqueue a task,
    # which is remote code execution on the worker. docker-compose.yml requires a
    # password here; this file shipped without one AND published on 0.0.0.0.
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

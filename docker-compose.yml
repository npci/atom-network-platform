services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: atom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: atom_user
      # Require an explicit password instead of a repository-published default.
      # Set POSTGRES_PASSWORD in a local .env file or export it before starting compose.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: atom_cm_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:7432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atom_user -d atom_cm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atom_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_JDTLS: "${INSTALL_JDTLS:-false}"   # set true on high-RAM hosts for the LSP tool
        INSTALL_MERMAID: "${INSTALL_MERMAID:-false}"  # set true to bake mmdc for the Mermaid diagram engine
    container_name: atom_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-uat}
      DATABASE_URL: postgresql://atom_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/atom_cm_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      OLLAMA_URL: http://ollama:11434
      # Reranker — REMOTE backend. torch and sentence-transformers no longer
      # live in this image (they cleared 6 SBOM findings by moving to the
      # `reranker` service below), so the in-process "local" backend has no
      # model library to load here. The remote path is functionally identical:
      # same model, same scores, one HTTP hop.
      #
      # Reranking is still gated by USE_RERANKER (default false) — set that in
      # backend/.env and start the sidecar with `--profile reranker`.
      RERANKER_BACKEND: ${RERANKER_BACKEND:-remote}
      RERANKER_URL: ${RERANKER_URL:-http://reranker:8200/rerank}
      # Verify build runs ONLINE (normal `mvn clean install … -U`): resolve deps from
      # Nexus like a real build, never offline.
      AGENTIC_VERIFY_OFFLINE: "false"
      # Phase B unified build+deploy — Session 23.
      # PHASE_B_RUNNER_MODE: "demo" (compose default — fully simulated, nothing
      # is built or deployed), "build" (real mvn build, no deploy), "ssh"
      # (SSH into another host and run the deploy script) or "local" (run that
      # script as a subprocess inside this container).
      # Override via backend/.env if your host or user differ. The key
      # path below is where the docker mount lands inside the container.
      PHASE_B_RUNNER_MODE: ${PHASE_B_RUNNER_MODE:-demo}
      # No default host/user: these named a real internal build box. The default
      # runner mode is "demo", which is fully simulated and never dials out, so
      # an empty value here is correct until an operator sets one in backend/.env.
      PHASE_B_HOST: ${PHASE_B_HOST:-}
      PHASE_B_HOST_USER: ${PHASE_B_HOST_USER:-}
      PHASE_B_HOST_KEY: /run/secrets/deploy_key
      # No default: the previous one was an absolute path on a specific internal
      # build box. Operators set PHASE_B_BUILD_SCRIPT to their own script path.
      PHASE_B_BUILD_SCRIPT: ${PHASE_B_BUILD_SCRIPT:-}
      # Negotiation round window. Default = 1440 minutes (24h), matching
      # production. (Was 5 min for fast dev testing of the round-close /
      # silent-acceptance loop; raised to 24h so dev mirrors real timing and
      # changes don't auto-freeze mid-test.) Override per-shell with the env var,
      # e.g. NEGOTIATION_ROUND_MINUTES=5 for quick freeze-flow testing.
      NEGOTIATION_ROUND_MINUTES: ${NEGOTIATION_ROUND_MINUTES:-1440}
    # WHY extra_hosts: Docker Desktop on Mac/Windows auto-defines
    # host.docker.internal → the host's loopback. On Linux Docker it's NOT
    # defined unless you add this line. `host-gateway` is a special Docker
    # keyword (20.10+) that resolves to the host's gateway IP. No-op on
    # Mac/Windows; required on Linux. Safe to keep everywhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./artifacts:/app/artifacts
      - ./knowledge_base:/app/knowledge_base
      - ./scripts:/app/scripts
      # The Authority Policy seed document — read-only bind for first-boot seeding
      # of the policy singleton table. After seed, admins maintain content
      # via the Admin UI; the file remains as a reset-to-seed source.
      - ./backend/data/authority_policy.md:/app/data/authority_policy.md:ro
      # Docker socket removed for security — use Docker-in-Docker sidecar for sandboxed builds
      # Phase B SSH key — mount the operator's deploy key read-only.
      # Set PHASE_B_HOST_KEY_FILE in your shell or .env to the host path
      # of the private key (e.g. ~/.ssh/deploy_key). Falls back to a
      # /dev/null tombstone if unset so the bind doesn't error out — the
      # build call will then fail loudly with "permission denied".
      - ${PHASE_B_HOST_KEY_FILE:-/dev/null}:/run/secrets/deploy_key:ro
      # LLM call log (Slice 24+ — observability extension). One JSONL
      # row per LLM round-trip; rotated by Python's RotatingFileHandler
      # (50MB × 10). Mount lets ops grep / jq / duckdb the file from
      # the host without entering the container.
      - ./logs:/app/logs
      # Agentic codegen workspace — SHARED with the celery worker that runs the
      # pipeline, so the backend API can read the clone/diff the worker produced.
      # Host bind mount (owned by uid 1000 = appuser) so the worker can mkdir run
      # dirs here; a named volume comes up root-owned and denies appuser writes.
      - ./workspace:/app/workspace
      # Persistent Maven cache — warmed once (online) so the verification gate's
      # offline `mvn -o` builds resolve from cache instead of failing/redownloading.
      - m2_cache:/root/.m2
      # Dev runs the build as appuser (HOME=/home/appuser) — persist ITS ~/.m2 so deps
      # downloaded online aren't re-fetched on every container recreate.
      - m2_appuser:/home/appuser/.m2
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Attached to both the project default (postgres/redis/ollama/etc.)
    # AND the cert-agent's network (defined by `certagent/docker-compose.yml`)
    # so cert_push can resolve `cert-agent:8000`. The certagent stack must
    # be `up` first so the external network exists at start time.
    networks:
      - default
      - cert-net
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_JDTLS: "${INSTALL_JDTLS:-false}"   # set true on high-RAM hosts for the LSP tool
        INSTALL_MERMAID: "${INSTALL_MERMAID:-false}"  # set true to bake mmdc for the Mermaid diagram engine
    container_name: atom_celery
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://atom_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/atom_cm_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      OLLAMA_URL: http://ollama:11434
      # Same reranker wiring as the backend — the agentic pipeline runs
      # retrieval in THIS process, so a worker left on the "local" backend
      # would try to import a sentence-transformers that is no longer in the
      # image and silently fall back to un-reranked results.
      RERANKER_BACKEND: ${RERANKER_BACKEND:-remote}
      RERANKER_URL: ${RERANKER_URL:-http://reranker:8200/rerank}
      # Verify build runs HERE (the worker) — ONLINE (normal `mvn clean install … -U`):
      # resolve deps from Nexus like a real build, never offline.
      AGENTIC_VERIFY_OFFLINE: "false"
      NEGOTIATION_ROUND_MINUTES: ${NEGOTIATION_ROUND_MINUTES:-1440}
      NEGOTIATION_SWEEP_SECONDS: ${NEGOTIATION_SWEEP_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./artifacts:/app/artifacts
      - ./knowledge_base:/app/knowledge_base
      - ./logs:/app/logs
      # Docker socket removed for security — use Docker-in-Docker sidecar for sandboxed builds
      - ./workspace:/app/workspace            # shared with backend (agentic runs here); host bind, appuser-writable
      - m2_cache:/root/.m2                     # persistent Maven cache for offline verify builds
      - m2_appuser:/home/appuser/.m2           # appuser ~/.m2 (dev runs the build as appuser)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - cert-net
    # -Q is MANDATORY, not tuning. celery_tasks.py routes agentic.drive/.reverify/
    # .push/.recover to the dedicated `agentic` queue; a worker started without -Q
    # consumes ONLY the default `celery` queue, so every agentic message piles up in
    # Redis unread — runs are created but never driven, the UI sits on "Getting
    # ready" forever, and agentic.recover (routed to that same unread queue) can't
    # rescue them either. Both queues on one worker keeps the single-container
    # quickstart working; see docs/OPERATIONAL_RUNBOOKS.md §3 for the two-worker
    # split that additionally stops long agentic runs starving the short sweeps.
    command: celery -A app.services.celery_tasks worker --loglevel=info -Q agentic,celery

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_JDTLS: "${INSTALL_JDTLS:-false}"   # set true on high-RAM hosts for the LSP tool
        INSTALL_MERMAID: "${INSTALL_MERMAID:-false}"  # set true to bake mmdc for the Mermaid diagram engine
    container_name: atom_celery_beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://atom_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/atom_cm_db
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379/0
      NEGOTIATION_ROUND_MINUTES: ${NEGOTIATION_ROUND_MINUTES:-1440}
      NEGOTIATION_SWEEP_SECONDS: ${NEGOTIATION_SWEEP_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./artifacts:/app/artifacts
      - ./knowledge_base:/app/knowledge_base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - cert-net
    command: celery -A app.services.celery_tasks beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # UI wording for THIS deployment. Unset by default, so the interface
        # renders the ecosystem-neutral defaults from src/strings.js. A
        # deployment that wants its own vocabulary points LABEL_PROFILE at a
        # JSON file in the frontend build context.
        LABEL_PROFILE: ${LABEL_PROFILE-}
    container_name: atom_frontend
    restart: unless-stopped
    environment:
      CONTEXT_PATH: ${AUTHORITY_CONTEXT:-a2a}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── Cross-encoder reranker (optional) ───────────────────────────────────────
  #
  # Holds the torch + sentence-transformers stack so the BACKEND image does not.
  # That split cleared 6 of the 18 findings in the 2026-08-27 A2A compliance
  # SBOM (sentence-transformers CVE-2026-68770 at CVSS 9.8, plus five torch
  # CVEs) WITHOUT losing reranking, which is worth +5-15pp recall@10.
  #
  # OPTIONAL, via a compose profile: the reranker itself defaults to off
  # (USE_RERANKER=false), so bringing up this container by default would spend
  # ~2 GB of image and ~1.5 GB of RAM on something switched off. Start it only
  # when you actually want reranking:
  #
  #     docker compose --profile reranker up -d
  #
  # and set USE_RERANKER=true in backend/.env. The backend's RERANKER_BACKEND
  # and RERANKER_URL below already point here, so no other wiring is needed.
  #
  # If this service is NOT running while USE_RERANKER=true, retrieval fails
  # OPEN — app/rag/reranker.py::_rerank_remote catches the connection error and
  # returns RRF order. Search keeps working, slightly less well. Watch
  # /healthz's `model_loaded` field so that degradation is visible rather than
  # silent.
  reranker:
    profiles: ["reranker"]
    build:
      context: ./services/reranker
      dockerfile: Dockerfile
    container_name: atom_reranker
    restart: unless-stopped
    environment:
      # OPERATOR-SET, NEVER CALLER-SET. This is the control that keeps
      # CVE-2026-68770 (unsafe deserialisation of a malicious model artifact)
      # unreachable: the service does not accept a model name from the request
      # body. Do not make this caller-influenced without re-triaging that CVE.
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      LOG_LEVEL: ${RERANKER_LOG_LEVEL:-INFO}
    volumes:
      # Persist the ~600 MB weight download across container recreation.
      # Without this, every `docker compose up` re-downloads the model and the
      # first request after each restart waits on it.
      - reranker_models:/models
    # No ports published. The backend reaches it over the compose network at
    # http://reranker:8200; nothing outside the network needs to.
    healthcheck:
      # Uses the readiness signal, not just liveness: `model_loaded: false`
      # means the container is up but reranking would silently degrade.
      test: ["CMD-SHELL", "python -c \"import urllib.request,json,sys; d=json.load(urllib.request.urlopen('http://localhost:8200/healthz')); sys.exit(0 if d.get('model_loaded') else 1)\""]
      # start_period is generous on purpose: the first boot downloads ~600 MB.
      start_period: 300s
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Ollama (local embeddings for RAG) ────────────────────────────────────────

  ollama:
    image: ollama/ollama:latest
    container_name: atom_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Host port omitted — native Ollama already binds 11434.
    # Backends reach this container via Docker network (http://ollama:11434).

  # ── Partner Platform ──────────────────────────────────────────────────────────
  #
  # The partner platform now lives in its own repository and runs as its own
  # stack: https://github.com/npci/atom-partner-platform
  #
  # It is a *client* of this platform over A2A, not a co-deployed service. Point
  # it at this instance from its Settings UI (Authority Platform URL + the
  # partner credentials issued during onboarding). Its own compose file brings up
  # its backend, frontend and Postgres.

  # ── Nginx ───────────────────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: atom_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # NOTE: do NOT re-add "8090:80" here. :8090 belongs to the precert sim
      # (precert/src/main/resources/application-{dev,test}.yml), which the precert
      # engine drives at https://host.docker.internal:8090. nginx on :80 already
      # serves every context, so the alias was redundant — and it made the platform
      # stack and precert mutually exclusive on a single host.
    environment:
      AUTHORITY_CONTEXT: ${AUTHORITY_CONTEXT:-a2a}
      CERTSIM_CONTEXT: ${CERTSIM_CONTEXT:-a2a-certsim}
      CERTSIM_INTERNAL_TOKEN: ${CERTSIM_INTERNAL_TOKEN:?CERTSIM_INTERNAL_TOKEN must be set}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/nginx.dev.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/docker-entrypoint.sh"]
    depends_on:
      - backend
      - frontend

volumes:
  m2_cache:                 # persistent Maven (~/.m2) cache so offline verify builds resolve
  m2_appuser:               # appuser ~/.m2 (dev build user) — persists online-resolved deps
  postgres_data:
  redis_data:
  ollama_data:
  reranker_models:          # cross-encoder weights (~600MB) — survives recreation

networks:
  # Implicit project network — declared explicitly so services that opt
  # into `cert-net` can still keep `default` (services listing `networks:`
  # only join the listed ones, not also the default).
  default:
  # External network owned by `certagent/docker-compose.yml`. The certagent
  # stack must be running (or the network pre-created) before this stack
  # starts; otherwise the services that attach to it will refuse to start
  # with "network certagent_cert-net declared as external, but could not
  # be found".
  cert-net:
    external: true
    name: certagent_cert-net

#
# HASH-LOCKED DEPENDENCY LOCKFILE — SEC-3 step 3.  ARCH: linux/arm64
# GENERATED FILE. Do not hand-edit: an edit desynchronises the hashes from the
# versions and every install fails closed.
#
# WHY A LOCK AT ALL: requirements.txt pins VERSIONS, which stops resolution
# drift. It does NOT pin CONTENT — a re-uploaded or substituted artifact at the
# same version still installs clean. Every distribution below is pinned by
# SHA-256, so a tampered artifact fails the install instead of shipping. The
# lock also covers the full TRANSITIVE closure (176 packages vs 64 direct).
#
# WHY PER-ARCHITECTURE, NOT ONE FILE: torch 2.6.0 declares NVIDIA CUDA
# dependencies on x86_64 that DO NOT EXIST in the aarch64 graph — 13 nvidia-*
# wheels, and the x86_64 closure is 190 packages against aarch64's 176. A lock
# compiled on one arch therefore fails closed on the other under
# --require-hashes ("Hashes are required ... but they are missing"). Both are
# committed and each is verified on its own architecture. Pick the one matching
# your build; there is deliberately no arch-neutral "requirements.lock" to
# mistake for universal.
#
# REGENERATE (must run in a container of the TARGET arch — resolution is
# Python- and platform-specific; compiling on macOS records the wrong wheels):
#
#   docker run --rm --platform linux/arm64 --user root \
#     -v "$PWD/backend:/w" -w /w --entrypoint sh oss-a2a-platform-backend:latest -c '
#       pip install --no-cache-dir pip-tools==7.4.1 &&
#       pip-compile --generate-hashes --no-strip-extras --allow-unsafe \
#                   --no-header --output-file=/w/requirements.arm64.lock /w/requirements.txt'
#
#   --allow-unsafe is required, not optional: without it setuptools is left
#   unpinned and pip REJECTS the entire file under --require-hashes.
#   Re-add this header afterwards; --no-header strips pip-compile's own.
#
#
# SCA Tier 3a, 2026-08-15: langchain-core 0.3.63->0.3.85, langgraph
# 0.2.76->0.3.15, langchain 0.3.9->0.3.30. These stay on the 0.x line and
# clear BOTH CRITICAL findings plus three HIGH; the remaining five need the
# 1.x majors and are tracked as Tier 3b.
#
# Side effect worth knowing: langchain 0.3.30 no longer depends on aiohttp,
# so aiohttp/aiosignal/frozenlist/multidict/yarl/propcache LEFT the closure
# (173 packages, down from 176). No first-party module imports them — checked
# before accepting the drop. Anything that starts importing aiohttp must pin
# it directly rather than relying on langchain to supply it.
#
# SCA Tier 4, 2026-08-15: torch 2.6.0 -> 2.9.1+cpu, taken from
# download.pytorch.org/whl/cpu (the --extra-index-url in requirements.txt,
# enabled in the same change). arm64 never carried the CUDA wheels — they are
# x86-only — so the visible effect here is just the version bump; the size win
# lands on amd64, which drops 13 nvidia-* packages.
#
# SCA Tier 3b, 2026-08-15: fastapi 0.118.0->0.141.1, starlette 0.48.0->1.3.1,
# langchain 0.3.30->1.3.9, langchain-core 0.3.85->1.5.5, langgraph

[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    eval: tests that exercise the retrieval/enrichment/code-change eval harness; require live DB + Ollama
    sandbox: tests that require a live Docker daemon; skipped when daemon unavailable
    age: tests that require Postgres with Apache AGE + named graph; skipped when graph is unreachable
    lsp: tests that require multilspy + a Python LSP backend; skipped when multilspy is unavailable

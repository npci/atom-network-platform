[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Override via DATABASE_URL env var (see alembic/env.py).
# The password is intentionally omitted here — set DATABASE_URL in your
# environment or .env file (which is gitignored).
sqlalchemy.url = postgresql://atom_user@localhost:5432/atom_cm_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

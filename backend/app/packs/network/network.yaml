wire_format: xml

# ── Certification wire identity ──────────────────────────────────────────────
#
# Every key in this section is REQUIRED because this pack declares
# `certification_harness:` below, and the loader refuses a certifying pack that
# omits one (app/core/domain/config_pack.py). None of them can be defaulted:
# each is matched, byte for byte, by a counterparty outside this repository —
# the cert agent, the partner platform, the bank simulator. A wrong value does
# not raise anywhere; it produces a payload that is rejected or a lookup that
# finds nothing, with no code path looking wrong.

# The token naming each side of a certification exchange. Written to the
# `initiated_by` column, used as the key of each side's counts in the push
# summary the SPA renders, and compared against the counterparty's test-case
# catalogue (`initiatedby`). These are the CERT AGENT'S names for the two
# sides, not this platform's vocabulary — which is why they are carried as pack
# data. Change them only in lockstep with that agent and a migration for the
# rows already written.
cert_roles:
  authority: NPCI
  partner: BANK
  # The certification WORKBOOK carries a second, differently-cased spelling of
  # the same two roles in `txn_initiated_by`, and cert-agent matches it exactly.
  # Stated rather than derived: upper-casing `partner` would emit "BANK" and
  # silently stop matching.
  partner_wire: Bank


# Fallback test data for a generated case that supplies none. These CROSS THE
# WIRE: the counterparty's simulator resolves them against its own seeded
# directory, so an address it does not know turns a nominal happy-path case
# into an unknown-address failure. Set these to addresses YOUR simulator has
# been seeded with.
cert_test_defaults:
  payer_vpa: test@example
  payee_vpa: merchant@example
  amount: '1.00'
  currency: INR

wire_envelope:
  root_element: NetworkRequest
  namespace: http://example.org/network/schema/
  org_id: AUTH_CERT

# Built-in request templates, keyed by flow code. These were module constants in
# services/xml_template_resolver.py, which meant this repository shipped one
# ecosystem's message set — its parties, its credential blocks, its account
# identifiers — as the answer for every domain. They are pack DATA for the same
# reason `wire_envelope:` is: the counterparty schema-validates the rendered
# payload, so the SHAPE has to be the one that deployment's counterparty
# expects. The platform now ships no catalogue at all; a flow with no template
# here falls through to the LLM template generator, which is already what
# happened for any flow code the catalogue did not cover.
#
# `__WIRE_ROOT__` / `__WIRE_NS__` / `__WIRE_ORG__` are substituted from
# `wire_envelope:` above at resolve time, so changing the envelope does not
# require re-seeding templates.
#
# `placeholders:` is the set a GENERATED template may use. The resolver falls
# back to a domain-neutral subset for a pack that declares none, since every
# domain has a correlation id but only some have an addressing handle.
wire_templates:
  placeholders:
  - txn_id
  - run_id
  - tc_id
  - correlation_id
  - payer_vpa
  - payee_vpa
  - amount
  - currency
  - remarks
  - timestamp
  - callback_url
  catalog:
    PAY: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <__WIRE_ROOT__ xmlns="__WIRE_NS__">
        <Head ver="2.0" ts="{{timestamp}}" orgId="__WIRE_ORG__"/>
        <Meta tc_id="{{tc_id}}" run_id="{{run_id}}"/>
        <Txn id="{{correlation_id}}" refId="{{correlation_id}}" type="PAY"
             note="{{remarks}}" ts="{{timestamp}}"/>
        <Payer addr="{{payer_vpa}}" code="CERT" type="PERSON">
          <Amount cur="{{currency}}" value="{{amount}}"/>
        </Payer>
        <Payees>
          <Payee addr="{{payee_vpa}}" code="CERT" type="ENTITY"/>
        </Payees>
        <CallbackUrl>{{callback_url}}</CallbackUrl>
      </__WIRE_ROOT__>
    COLLECT: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <__WIRE_ROOT__ xmlns="__WIRE_NS__">
        <Head ver="2.0" ts="{{timestamp}}" orgId="__WIRE_ORG__"/>
        <Meta tc_id="{{tc_id}}" run_id="{{run_id}}"/>
        <Txn id="{{correlation_id}}" refId="{{correlation_id}}" type="COLLECT"
             note="{{remarks}}" ts="{{timestamp}}" expiry="{{collect_expiry}}"/>
        <Payer addr="{{payer_vpa}}" code="CERT" type="PERSON">
          <Amount cur="{{currency}}" value="{{amount}}"/>
        </Payer>
        <Payees>
          <Payee addr="{{payee_vpa}}" code="CERT" type="ENTITY"/>
        </Payees>
        <CallbackUrl>{{callback_url}}</CallbackUrl>
      </__WIRE_ROOT__>
    MANDATE: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <__WIRE_ROOT__ xmlns="__WIRE_NS__">
        <Head ver="2.0" ts="{{timestamp}}" orgId="__WIRE_ORG__"/>
        <Meta tc_id="{{tc_id}}" run_id="{{run_id}}"/>
        <Txn id="{{correlation_id}}" refId="{{correlation_id}}" type="MANDATE" ts="{{timestamp}}"/>
        <Mandate type="{{mandate_type}}" frequency="{{frequency}}">
          <Payer addr="{{payer_vpa}}" code="CERT">
            <Amount cur="{{currency}}" value="{{amount}}"/>
          </Payer>
          <Payee addr="{{payee_vpa}}" code="CERT"/>
        </Mandate>
        <CallbackUrl>{{callback_url}}</CallbackUrl>
      </__WIRE_ROOT__>
    REFUND: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <__WIRE_ROOT__ xmlns="__WIRE_NS__">
        <Head ver="2.0" ts="{{timestamp}}" orgId="__WIRE_ORG__"/>
        <Meta tc_id="{{tc_id}}" run_id="{{run_id}}"/>
        <Txn id="{{correlation_id}}" refId="{{correlation_id}}" type="REFUND"
             note="{{remarks}}" ts="{{timestamp}}"/>
        <Payer addr="{{payer_vpa}}" code="CERT" type="ENTITY">
          <Amount cur="{{currency}}" value="{{amount}}"/>
        </Payer>
        <Payees>
          <Payee addr="{{payee_vpa}}" code="CERT" type="PERSON"/>
        </Payees>
        <CallbackUrl>{{callback_url}}</CallbackUrl>
      </__WIRE_ROOT__>
    BALANCE: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <__WIRE_ROOT__ xmlns="__WIRE_NS__">
        <Head ver="2.0" ts="{{timestamp}}" orgId="__WIRE_ORG__"/>
        <Meta tc_id="{{tc_id}}" run_id="{{run_id}}"/>
        <Txn id="{{correlation_id}}" refId="{{correlation_id}}" type="BAL_ENQUIRY" ts="{{timestamp}}"/>
        <Payer addr="{{payer_vpa}}" code="CERT" type="PERSON"/>
        <CallbackUrl>{{callback_url}}</CallbackUrl>
      </__WIRE_ROOT__>
    VALCUST: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <__WIRE_ROOT__ xmlns="__WIRE_NS__">
        <Head ver="2.0" ts="{{timestamp}}" orgId="__WIRE_ORG__"/>
        <Meta tc_id="{{tc_id}}" run_id="{{run_id}}"/>
        <Txn id="{{correlation_id}}" refId="{{correlation_id}}" type="VALCUST" ts="{{timestamp}}"/>
        <Payer addr="{{payer_vpa}}" code="CERT" type="PERSON">
          <Creds>
            <Cred type="PIN" subType="MPIN" format="{{mpin_format}}"/>
          </Creds>
          <Ac ifsc="{{ifsc}}" acType="{{account_type}}"/>
        </Payer>
        <CallbackUrl>{{callback_url}}</CallbackUrl>
      </__WIRE_ROOT__>
    CHKTXN: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <__WIRE_ROOT__ xmlns="__WIRE_NS__">
        <Head ver="2.0" ts="{{timestamp}}" orgId="__WIRE_ORG__"/>
        <Meta tc_id="{{tc_id}}" run_id="{{run_id}}"/>
        <Txn id="{{correlation_id}}" refId="{{correlation_id}}" type="CHKTXN" ts="{{timestamp}}"
             orgTxnId="{{original_txn_id}}"/>
        <Payer addr="{{payer_vpa}}" code="CERT" type="PERSON"/>
        <CallbackUrl>{{callback_url}}</CallbackUrl>
      </__WIRE_ROOT__>
    REVERSAL: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <__WIRE_ROOT__ xmlns="__WIRE_NS__">
        <Head ver="2.0" ts="{{timestamp}}" orgId="__WIRE_ORG__"/>
        <Meta tc_id="{{tc_id}}" run_id="{{run_id}}"/>
        <Txn id="{{correlation_id}}" refId="{{correlation_id}}" type="REVERSAL"
             orgTxnId="{{original_txn_id}}" ts="{{timestamp}}"/>
        <Payer addr="{{payer_vpa}}" code="CERT" type="PERSON">
          <Amount cur="{{currency}}" value="{{amount}}"/>
        </Payer>
        <Payees>
          <Payee addr="{{payee_vpa}}" code="CERT" type="ENTITY"/>
        </Payees>
        <CallbackUrl>{{callback_url}}</CallbackUrl>
      </__WIRE_ROOT__>
    MINISTMT: |-
      <?xml version="1.0" encoding="UTF-8"?>
      <__WIRE_ROOT__ xmlns="__WIRE_NS__">
        <Head ver="2.0" ts="{{timestamp}}" orgId="__WIRE_ORG__"/>
        <Meta tc_id="{{tc_id}}" run_id="{{run_id}}"/>
        <Txn id="{{correlation_id}}" refId="{{correlation_id}}" type="MINISTMT" ts="{{timestamp}}"/>
        <Payer addr="{{payer_vpa}}" code="CERT" type="PERSON"/>
        <CallbackUrl>{{callback_url}}</CallbackUrl>
      </__WIRE_ROOT__>

# The shape of a network response code, for the "does this document actually name
# codes?" document checks. Verbatim the literal that used to sit in
# services/evaluation/deterministic.py and agents/document_validator.py, so
# the network's verdicts are unchanged by moving it here.
error_code_pattern: \b(?:U\d{1,3}|Z\d{1,2}|RB|XT|XD|YB|YC|YD|00)\b
# The network certifies through the platform's pack-driven simulator when running
# from this config pack. (The Python NetworkPack class also declares cert_agent/precert
# harnesses, but the registry no longer loads Python packs — this key is what
# makes certification reachable on a YAML-configured deployment.) The name
# resolves through app/services/cert_harnesses.py at dispatch.
certification_harness: sim_pack

# The network distributes over A2A (the Python NetworkPack also wires this; the registry no
# longer loads Python packs, so this key is what reaches the channel on a
# YAML-configured deployment). Resolved via app/services/partner_channels.py.
partner_channel: a2a

# The shape of a network wire message NAME (ReqTransfer, RespBalEnq, the
# synchronous Ack). One pattern for every consumer that scans prose/plans/schemas
# for message tokens (api_registry_ingest, xsd_context, plan_files) — previously
# three near-identical hardcoded regexes. A domain that declares none gets
# "no messages found", never the network's convention by accident.
message_name_pattern: \b(?:Req|Resp)[A-Z][A-Za-z0-9]+\b|\bAck\b

# Wire message name -> cert-engine flow family. Verbatim the offline/baseline
# `_API_TO_FLOW` table that lived in services/tc_store_sync.py; cert-agent's
# live flow_registry still extends it at sync time. Empty for a domain means
# "no baseline flows" — unmapped stubs surface as unknown_apis for the
# operator instead of being guessed into a flow.
message_flows:
  ReqTransfer: PAY
  ReqTransfer_Debit: PAY
  ReqTransfer_Credit: PAY
  RespTransfer: PAY
  ReqCollect: COLLECT
  RespCollect: COLLECT
  ReqMandate: MANDATE
  RespMandate: MANDATE
  ReqValCust: VALCUST
  RespValCust: VALCUST
  ReqChkTxn: CHKTXN
  RespChkTxn: CHKTXN
  ReqRefund: REFUND
  RespRefund: REFUND
  ReqBalEnq: BALANCE
  RespBalEnq: BALANCE
  ReqMiniStmt: MINISTMT
  RespMiniStmt: MINISTMT
  ReqReversal: REVERSAL
  RespReversal: REVERSAL

# Heuristic FR-tagging regexes (services/brd_requirements.py). Stored as the
# regexes themselves — verbatim the previous module constants — rather than
# synthesized from labels, because synthesis could not reproduce the network's
# hand-tuned negative lookaheads byte-for-byte. A pack that declares none
# tags nothing.
operation_patterns:
  init: \b(initiat[eio]|reqtransfer|reqmandate|start[a-z]* (?:the )?(?:transaction|payment))\b
  auth: \b(auth(?:oris|oriz)ation|reqauth|authenticat|network\s*pin|cred(?:ential)? block)\b
  debit: \b(debit(?!ing|[- ]?reversal|[- ]?rollback)|debiting|remitter(?:[- ]?bank)?\s+debit|charge account)\b
  credit: \b(credit(?!ing|[- ]?reversal|[- ]?rollback)|crediting|beneficiary\s+credit|payee\s+credit)\b
  debit_reversal: \b(debit[- ]?reversal|reverse[a-z]* (?:the )?debit|refund the debit|debit rollback)\b
  credit_reversal: \b(credit[- ]?reversal|reverse[a-z]* (?:the )?credit|refund the credit|credit rollback)\b
  meta_query: \b(reqlist|reqhbt|reqrulechk|list of psp|list of keys|health\s*check|heartbeat)\b
party_patterns:
  PAYER_PSP: \b(payer\s+psp|payer[- ]?psp|initiating\s+psp)\b
  PAYEE_PSP: \b(payee\s+psp|payee[- ]?psp|receiving\s+psp)\b
  REMITTER_BANK: \b(remitter(?:[- ]?bank)?|issuer(?:[- ]?bank)?|remitting bank)\b
  BENEFICIARY_BANK: \b(beneficiary(?:[- ]?bank)?|receiving bank)\b

# Change operations that MOVE MONEY — an FR tagged with any of these is a
# "financial" flow; everything else is "meta". A domain that declares none
# classifies every flow as meta, which is a true statement about it.
financial_operations:
- debit
- credit
- debit_reversal
- credit_reversal

# Loose party spellings the BRD extractor may see -> canonical party keys.
# Verbatim the alias map that lived in agents/brd_extractor.py.
party_aliases:
  ISSUER: REMITTER_BANK
  ISSUER_BANK: REMITTER_BANK
  REMITTER: REMITTER_BANK
  BENEFICIARY: BENEFICIARY_BANK
  PAYER: PAYER_PSP
  PAYEE: PAYEE_PSP
  PSP: PAYER_PSP
  SWITCH: AUTHORITY

# Short uppercase tokens that LOOK like network error codes but are ecosystem
# acronyms — the union of the three stopword lists the excel_testcase_engine
# carried (planner/validator/writer; planner alone also had PSP1 — unified
# here, so validator/writer now exclude PSP1 too). Structural tokens
# (REQ/RESP/NOTE/API/TSD/BRD/XSD) stay file-local: they are platform, not
# domain, vocabulary.
domain_acronyms:
- PSP
- PSP1
- VPA
- UMN
- IFSC
- CBS
- FRM
- OTP
- MPIN
- SMV

# Known semantically-equivalent namespace spellings in the wild (first member
# of each group is the de-facto production spelling). Verbatim the group that
# lived in agents/xsd_namespace.py; reuse-matching sees through the split,
# humans reconcile it.
schema_namespaces:
- - http://example.org/network/schema/
  - http://www.example.net/network/schema/

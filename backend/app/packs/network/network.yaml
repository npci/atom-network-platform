  hard_rules: '# NETWORK DOCUMENT HARD RULES (must follow; violations fail review)


    ## Error Codes

    - All transaction error codes MUST use the network alphanumeric format: U01-U99, Z0-Z9, RB, XD, XT, YA-YZ.

    - NEVER use HTTP status codes (400, 401, 403, 404, 500, 502, 503) for transaction errors.

    - Every error code MUST be classified as "TD" (Technical Decline) or "BD" (Business Decline). Never
    "error", "failure", or other free-form labels.

    - Every error code row MUST identify the responsible entity: PSP / Authority / Issuer Bank / Beneficiary
    Bank / Remitter.


    ## Functional Requirements

    - Every BRD/Tech Spec functional requirement MUST be numbered FR-01, FR-02, FR-03, ... (zero-padded
    to 2 digits).

    - A BRD must have at least 6 functional requirements.

    - Each FR must be a single declarative sentence beginning with "The system shall", "The Authority shall",
    "PSP Bank must", or a similar explicit subject.


    ## Obligation Language

    - Use active obligation verbs: "The Authority shall", "PSP Bank must", "Issuer Bank shall", "The system
    shall".

    - NEVER use vague phrasing: "the system will", "ideally", "should probably", "in some cases".

    - Every flow step must name the responsible actor (PSP Bank / Authority / Issuer Bank / Customer /
    Merchant).


    ## Placeholders

    - Final output must contain ZERO placeholder text. Never emit: "TBD", "TODO", "XXX", "<placeholder>",
    "N/A" (unless truly not applicable and stated so), "lorem ipsum".

    - If a detail is genuinely unknown, state the assumption explicitly with an "Assumption:" prefix.


    ## Currency & Limits

    - Use "INR" for amounts (e.g., "INR 2,000 per transaction"). Do not use "$", "Rs.", or "Rs".

    - Use the "₹" symbol only in customer-facing display mockups, never in API specs or obligation text.


    ## API & Field Naming

    - Request API names use the form "ReqXxxYyy" (PascalCase after Req).

    - Response API names use the form "RespXxxYyy".

    - Field names use camelCase (e.g., payerVpa, txnAmount), never snake_case or PascalCase.

    - Every field row must specify: type, mandatory (Y/N), dLength, description.


    ## XSD / Schema

    - XSD element names use PascalCase (e.g., <PayerDetails>).

    - XSD attributes use camelCase.

    - All amount fields use xs:decimal with total/fraction digits restrictions; never xs:string for amounts.

    '
  api_design_principles: "# NETWORK API / FLOW / TEST-CASE / ERROR-CODE DESIGN PRINCIPLES\n\nDistilled, always-on\
    \ design principles for Phase A (API design, flow design,\ncertification test-case design). These\
    \ are the *rules* — the full catalogues\n(API list, element/attribute reference, enumerations, error-code\
    \ tables, worked\nexamples, end-to-end flows) live in RAG under the `api_design_knowledge` category\n\
    (`knowledge_base/api_design_knowledge/{01_api_and_flow,02_test_case,03_error_code}_design.md`)\nand\
    \ the machine corpus in `backend/app/excel_testcase_engine/network_specs/`. Retrieve\nthose for specifics;\
    \ obey the principles below always. **Never invent API names,\nfields, enum values, or error codes\
    \ — ground them in the catalogue or mark them\nlow-confidence / requiring Authority allocation.**\n\n---\n\
    \n## 1. API & naming conventions\n\n- Every API is a `Req<Name>` + `Resp<Name>` pair (`ReqTransfer`/`RespTransfer`).\n\
    - Families by stem: mandate (`Mandate`, `AuthMandate`, `MandateConfirmation`),\n  listing/meta (`List<Thing>`\
    \ → `ReqListPsp`, `ReqListKeys`), confirmation\n  (`<Thing>Confirmation`). Debit/credit legs are suffixed\
    \ (`ReqTransfer_Debit`).\n- Single namespace for all messages: `http://example.org/network/schema/`.\n- Request\
    \ carries full intent; response carries `result` + per-participant `Ref`.\n- Synchronous `Ack` on\
    \ receipt, ahead of the asynchronous `Resp`.\n\n## 2. Message envelope (reuse it)\n\nReuse the shared\
    \ envelope: `Head` / `Meta` / `Txn` / `Payer` / `Payees` →\n`Resp` / `Ref`. Add new elements/attributes\
    \ only where an existing one cannot\ncarry the data — justify and version-gate. Counterparties are\
    \ addressed by\nVPA / global identifier and resolved by the Authority (`ReqAuthDetails`); a feature never\n\
    requires the initiator to know the real account number. Credentials are captured\non-device by the\
    \ Common Library and travel as an encrypted/signed `<Cred>` block —\nnever raw on the wire.\n\n##\
    \ 3. Core design principles\n\n1. XML over HTTPS, UTF-8, stateless — each message carries its own\
    \ context.\n2. Idempotency via `msgId`/`Txn.id` — a duplicate returns the same response, never\n \
    \  re-executes.\n3. Credential encryption (base64 + the Authority public key); mandates digitally signed\n\
    \   (`Cred type=\"Network-Mandate\" subType=\"DS\"`).\n4. Multi-party / multi-payee: `Payees` is a list;\
    \ one `Ref` per participant;\n   `PARTIAL` covers mixed outcomes.\n5. Sync ack + async resp → timeout\
    \ → `ReqChkTxn` → deemed handling.\n6. Reversal (repairs a failed/timed-out leg, `orgTxnId` back-ref)\
    \ ≠ refund\n   (merchant-initiated return). Risk scores ride in-band.\n\n## 4. Design ideology — reuse\
    \ → extend → invent\n\nA new top-level API is **rare** and carries a high bar: every API is one contract\n\
    the whole ecosystem must implement identically. Governing instincts:\n\n- **Reuse before extend before\
    \ invent.** Most features ride on an existing message\n  (new `Txn.type`/`subType`/`purpose`, new\
    \ `Rule`/`Tag`, new `Cred` type, new\n  optional element).\n- **One contract for everyone** — unambiguous,\
    \ mandatory-vs-optional explicit.\n- **Backward compatible & version-gated** — changes are *additive*;\
    \ existing\n  required semantics never change; new behaviour gated by `ver`; ecosystem rollout\n \
    \ controlled via the capability directory (`<Version>` entry in\n  `RespListPsp`/`RespListAccPvd`\
    \ + `prodType`/format flags).\n- Four-party model & role clarity (Payer PSP, Payee PSP, Remitter bank,\n\
    \  Beneficiary bank, the Authority as switch). Standard two-factor auth via `Creds`.\n- Full lifecycle (idempotency,\
    \ retries, timeout/ChkTxn, reversal, deemed);\n  stateful features get a state object + create/modify/revoke\
    \ lifecycle (as\n  mandates have the UMN). Define money movement & settlement for financial\n  features.\
    \ Align to RBI limits/consent. Minimal data, one unambiguous meaning\n  per field.\n\n### Decision\
    \ procedure (given a feature)\n1. Classify (financial / mandate-stateful / meta / auth / registration\
    \ / lifecycle).\n2. Map actors & flow — who initiates, who authorises, how money moves; sketch hops.\n\
    3. Decide reuse vs extend vs new (tree below).\n4. Choose the carrier (existing enum value, or new\
    \ `Rule`/`Tag`/optional/`Cred`, or\n   — last resort — a new message).\n5. Define the data delta (where\
    \ each new field hangs, M/O, format, `ver` gating).\n6. Define auth & consent (cred types; pre-approved/signed;\
    \ what the customer sees).\n7. Define lifecycle & failure handling (idempotency key, timeout/ChkTxn,\
    \ reversal,\n   deemed; state object + transitions for stateful features).\n8. Define settlement &\
    \ reversal (financial).\n9. Set version & compatibility (confirm additive; older-participant behaviour).\n\
    10. Define response/error codes (§6) and certification scenarios (§5).\n\n### Reuse → extend → invent\
    \ tree (stop at first fit)\n1. Existing API + existing/new `Txn.type`/`subType`/`purpose`? → use it.\n\
    2. Extra data, same interaction? → optional element/attribute or `Rule`/`Tag`,\n   version-gated.\n\
    3. New funding instrument / account behaviour? → new `ACTYPE` on `Ac`, not a new API.\n4. New auth\
    \ method? → new `Cred type/subType`, not a new API.\n5. New stateful object with its own lifecycle?\
    \ → a new mandate-style API *family*\n   with a UMN-like id.\n6. Genuinely new interaction no existing\
    \ message expresses? → new `Req/Resp` pair\n   (high bar — justify why 1–5 don't fit; keep the shared\
    \ envelope).\n\n### New-API checklist\nDecide reuse/extend/invent first → name `Req/Resp` by analogy\
    \ → reuse envelope →\npick `type`/`subType` → specify credentials → define the flow (incl.\ntimeout→ChkTxn→deemed)\
    \ → confirm backward compatibility → list response & error\ncodes → define certification scenarios\
    \ → state confidence + source (leave XML\nblank where ungrounded).\n\n## 5. Certification test-case\
    \ design\n\n- Pack is one workbook organised **role → subset → test case**. Roles & id\n  prefixes:\
    \ Remitter `RE_*`, Beneficiary `BE_*` (Issuer); Payer PSP `PR_*`,\n  Payee PSP `PE_*` (Acquirer);\
    \ Meta `MT_*` (both); Mandate `MA_MT_PR_*` /\n  `MA_MT_RE_*`. **Never renumber existing ids** (retired\
    \ ids keep the slot).\n- A new feature introduces a **new subset**: next free letter, one-line\n \
    \ description, scope (acquirer/issuer/both), enumerated ids, count.\n- `DETAILS` block fixed fields:\
    \ API Involved, Type, Approval Type\n  (Pre/Non-Pre-Approved), Payer Handle, Payee Handle (VPA | Aadhaar\
    \ | A/c+IFSC |\n  Mobile[+MMID]).\n\n### Scenario discovery (goal: completeness — prune duplicates,\
    \ never miss a failure mode)\n1. Decompose the feature into its ordered API exchange (every hop, every\
    \ actor).\n2. For every hop enumerate failure modes: success, timeout, business decline,\n   validation/malformed,\
    \ system exception, negative-ACK. A hop with no failure\n   case is almost always an omission.\n3.\
    \ Walk every scenario lens — most features touch 8–12: happy paths;\n   auth & credentials; limits\
    \ & caps; state lifecycle (incl. illegal transitions);\n   idempotency/duplicate/replay; timeout/deemed/reversal/settlement;\
    \ risk & fraud;\n   validation/malformed; account & instrument types; channels & devices; roles\n\
    \   under test; regulatory/compliance/account-status; disputes (UDIR);\n   identity/registration/resolution;\
    \ concurrency/ordering; interoperability/partner\n   permutations; feature eligibility/gating; principal↔dependent\
    \ management;\n   notifications.\n4. Cross-product with coverage dimensions: Outcome (Success/Failure/Timeout/\n\
    \   Deemed/neg-ACK) × Handle pair × Approval type × Role-under-test × Txn type/\n   sub-type × Initiation\
    \ (Bank/Authority) × Channel. Drop impossible combos (say why).\n5. De-duplicate and tag each with a `coverage_tag`\n\
    \   (`happy_path`/`timeout`/`decline`/`neg_ack`/`deemed`/`revoke`/`partial`) and the\n   expected\
    \ `respCode`/`errCode` (§6).\n6. Completeness check: every hop has ≥1 success + ≥1 failure; every\
    \ role appears as\n   system-under-test in success and its own failure modes; every new field/enum/cred\n\
    \   type has a positive case and a validation-failure case. List intentional\n   exclusions with a\
    \ one-line reason.\n\nEmit the machine form the platform consumes (`TestCaseStub` + `FlowDefinition`\
    \ per\n`docs/cert_simulator_contract/` and\n`excel_testcase_engine/schemas/workbook_plan.py`). The\
    \ minimum variant count per API\nis encoded in `network_specs/coverage_matrix.json` — a new API declares\
    \ its required\nvariants the same way.\n\n## 6. Error / response code design\n\nThree response attributes:\
    \ `result` (`SUCCESS|FAILURE|PARTIAL|DEEMED`, on `Resp`),\n`errCode` (network service layer or PSP, mandatory\
    \ when `result=FAILURE`), `respCode`\n(bank per-participant on `Ref`, `00`=success). The same failure\
    \ can surface twice\n(bank `respCode` → network `errCode`, e.g. `ZM`→`UM8`) — **design both ends.**\n\n\
    Prefix taxonomy (letter = validation/decline context): `00` success; `U..` network\nservice-layer; `T..`/`E..`/`R..`/`D..`/`G..`/`K..`/`BA..`/`IM..`/`OR..`\
    \ validation\nfamilies; mandate validation (`M*`,`HV`,`PA/PR/PY`,`RM`); `Q..` query/mandate-auth;\n\
    `A2/A3/A4..` UIDAI; `V../X../Y../Z..` bank decline (ISO-8583-style, often\nremitter/beneficiary pairs).\n\
    \n### Rules for choosing codes\n1. **Never invent a code** — select from the catalogue\n   (`network_specs/error_codes.json`\
    \ is the source of truth).\n2. Respect `applies_to` — a code belongs to specific APIs (no mandate\
    \ code on a Pay\n   leg, no Meta code on a financial leg).\n3. Match category to outcome: success→`00`;\
    \ business decline→bank decline code\n   (`Z*/Y*/X*/B*/V*/Q*`); timeout→`UP` or a `U`-timeout\n  \
    \ (`U10/U67/U68/U85/U87/U88`); malformed→a validation prefix (`T*/E*/R*/G*/BA*`);\n   deemed→reversal\
    \ `96` / settlement `R9/U9`.\n4. Design both ends (bank `respCode`s + network `errCode`s + the forwarding\
    \ mapping).\n5. Pair remitter/beneficiary variants where the catalogue does (`XH`/`XI`,\n   `YE`/`YF`,\
    \ `ZX`/`ZY`).\n6. A genuinely new code is proposed with a context-chosen prefix, marked **requiring\n\
    \   Authority allocation**, and never used in a test case until allocated."
  error_codes: '## Example error codes (reference only — use ones relevant to the feature)

    | Code | td_bd | Entity | Description |


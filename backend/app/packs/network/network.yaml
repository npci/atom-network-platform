# Participant roles whose channel must be mutually authenticated — a partner
# holding any of these belongs on the mTLS ingress (:8443), everyone else on the
# JWT-only one (:443). Here that is the ACCOUNT-HOLDING participants: they carry
# customer funds, so the trust demanded of their channel is higher than for an
# intermediary that only routes. Read by PATCH /admin/partners/{id}/tls-tier.
#
# Matched against the `partner_agents.partner_type` array, which on stored rows
# still uses the legacy spellings from the `PartnerType` enum — `remitter` and
# `beneficiary` are spelled identically in both, so no alias is needed. A pack
# that declares nothing here forces nobody onto mTLS by role alone.
high_assurance_participants:
- remitter
- beneficiary
# PII classes this domain can name that a country-neutral filter cannot.
# ADDITIVE to `core/pii_redaction.py`'s built-ins, which always run. These WERE
# built-ins, until it turned out that shipping them as the "generic" filter gave
# every deployment outside this country NO mobile-number redaction at all. The
# key becomes the placeholder text, so `MPIN` redacts to `[REDACTED-PII-MPIN]`.
#
# Declaration order is preserved and matters: these run ahead of the built-in
# bare-digit-run rule, so a mobile number is redacted AS a mobile number instead
# of being swallowed by the generic account-number pattern.
pii_patterns:
  # This scheme's secret-entry token. The built-in matches `pin`/`otp`/
  # `passcode` but deliberately not the inside of `MPIN`, so the domain says so.
  MPIN: '(?i)\b(?:mpin|m-pin)\D{0,10}\d{4,6}\b'
  # National mobile format: 10 digits opening 6-9, optional +91. A bare
  # national-format run carries no marker a neutral filter could recognise,
  # which is precisely why it has to be pack data.
  MOBILE: '\b(?:\+?91[-\s]?)?[6-9]\d{9}\b'
  # Customer references this ecosystem uses by name. Generic `cust`/`customer`
  # stays a built-in; these two spellings do not exist outside it.
  CUSTOMER-ID: '(?i)\b(?:crn|ucic)\s*(?:id|no\.?|number|#)?\s*[:=\-]?\s*[A-Z0-9]{6,20}\b'
# Repository topology. The network spans TWO repos: the framework/XSD "core" and the
# "app" (2.0) that consumes it. This is declared rather than assumed because the
# rule used to live hardcoded in the SPA (AnalysisPanel/XSD "exactly one core and
# one app"); the server-side gate never enforced it at all. With the client now
# deriving its rule from here, an undeclared topology means "no constraint" — so
# omitting this block would silently drop the network's two-repo guarantee, letting a run
# start with only the app repo and no framework/XSD in the workspace.
#
# builds_first on core: verification_plan bootstraps a full-reactor `mvn install`
# of every builds_first repo before per-module builds, so the app compiles against
# the freshly built framework jar rather than a stale one from .m2.
#
# NOTE: these keys must match the `role` column on registered CodeRepo rows. A
# repo with a NULL or different role is now rejected at run creation with a 400
# naming the expected keys — fix it in Admin -> Code Indexing.
repo_roles:
- key: core
  label: Core / framework (XSD)
  required: true
  multiple: false
  builds_first: true
- key: app
  label: Application (2.0)
  required: true
  multiple: false
  builds_first: false

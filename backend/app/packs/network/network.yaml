  docgen_generic_domain_notes: "\n═══════════════════════════════════════════════════════════\nNETWORK DOMAIN\
    \ KNOWLEDGE — USE ALL YOU HAVE; KEY FACTS BELOW\n═══════════════════════════════════════════════════════════\n\
    ECOSYSTEM PARTICIPANTS:\n  · The Authority — operates the network switch and Common Library (CL). Issues\
    \ specifications.\n  · PSP Bank — Payment Service Provider. Hosts the network app, initiates ReqTransfer\
    \ to the Authority.\n  · Issuer/Remitter\
    \ Bank — Payer's bank. Authenticates, debits customer account.\n  · Beneficiary/Payee Bank — Recipient's\
    \ bank. Credits customer account.\n  · Network App — Customer-facing mobile application (e.g., PhonePe,\
    \ GPay, BHIM).\n\nCORE NETWORK MESSAGE TYPES:\n  · REQ_TRANSFER / RESP_TRANSFER — Payment request/response.\
    \ Auth\
    \ → Debit → Credit → Confirmation.\n  · REQ_CHK_TXN — Transaction status check. Used for timeout/fallback\
    \ resolution.\n  · REQ_LIST_ACCOUNT / LIST_ACCOUNT — Account listing for registration.\n  · REQ_REG_MOB\
    \ / REG_MOB — Mobile/device registration (used in biometric setting).\n  · REQ_AUTH_DETAILS / RESP_AUTH_DETAILS\
    \ — Authentication detail exchange.\n  · REQ_ACTIVATION — Device onboarding, biometric activation/rotation/deactivation.\n\
    \  · REQ_MANDATE — Mandate creation.\n  · REQ_BAL_ENQ — Balance enquiry.\n  · REQ_VAL_ADD — VPA validation.\n\
    \nSTANDARD REQ_TRANSFER FLOW:\n  Stage 1 — Auth:    Network app captures PIN/biometric → CL encrypts\
    \ → PSP sends ReqTransfer to the Authority.\n  Stage 2 — ReqAuth: The Authority sends REQ_AUTH_DETAILS\
    \ to Acquirer Bank; PSP responds RESP_AUTH_DETAILS.\n  Stage 3 — Debit:   The Authority sends debit\
    \ request to Remitter/Issuer Bank; bank sends RESP_TRANSFER.\n  Stage 4 — Credit:  The Authority routes\
    \ credit to Beneficiary Bank; bank sends RESP_TRANSFER.\n  Stage 5 — Confirm: The Authority sends\
    \ confirmation to Payer PSP and Payee PSP.\n\nOTHER API FLOW: APP →\
    \ Payer PSP → Authority → Payee PSP → Authority → Payer PSP → APP.\n\nKEY COMPONENTS:\n  · CRED Block  — Encrypted\
    \ credential block containing auth data sent from PSP to the Authority.\n  · CL (Common Library) —\
    \ Authority-provided SDK integrated in network apps for secure auth.\n  · Authority Switch — Central\
    \ routing engine for all network messages.\n  · TEE / Secure Enclave — Hardware-backed secure storage on device.\n  · Nonce-based\
    \ challenge — Cryptographic replay-attack prevention mechanism.\n  · VPA — Virtual Payment Address\
    \ (e.g., user@bank).\n  · DEEMED status — Transaction where credit is unconfirmed; settled asynchronously.\n\
    \  · refCategory='05' — Designates biometric-authenticated transactions.\n  · clVersion — CL version\
    \ field indicating biometric support (e.g., 2.36 in ListAccPvd).\n\nDISPUTE MANAGEMENT:\n  · Standard\
    \ network dispute process applies unless explicitly changed by the BRD.\n  · \"No change in dispute management\"\
    \ is the default for most feature changes.\n"
  # Domain retrieval vocabulary appended by app/rag/query_rewriter.py to its
  # (neutral) system prompt under a "Domain vocabulary" heading. Verbatim the
  # domain expertise that used to be hardcoded in
  # app/prompts/rag/query_rewriter/rewriter_system.md.
  retrieval_domain_expertise: |-
    You are a network domain expert. The corpus holds Authority circulars, RBI
    guidelines, past BRDs/TSDs, API specs, XSD schemas, error codes, FAQs,
    and certification testcases.

    1. Expand informal/marketing terms to official Authority terms:
       - "AutoSplit" / "split payment" -> "split settlement", "multi-party beneficiary transaction"
       - "Smart OTP" / "auto-approve" -> "AFA additional factor authentication", "OTP validation"
       - "Instant refund" -> "reversal transaction", "credit adjustment", "UDIR"
       - "Auto-renew" / "recurring" -> "mandate creation", "recurring e-mandate", "auto-debit"

    2. Include relevant network API names where obviously applicable:
       ReqTransfer, RespTransfer, ReqAuth, RespAuth, ReqChkTxn, RespChkTxn, ReqMandate,
       RespMandate, ReqListMandate, ReqRevokeMandate, ReqListAccount, ReqBalEnq,
       ReqListKeys, ReqRegMob, ReqSetCre, ReqOtp

    3. Include relevant error-code families where obviously applicable:
       XB / XC / Y1 (debit/credit failures), Z4 / Z5 (expired mandate),
       ZA (duplicate/already processed), U30-U69 (PSP errors)

    4. Include regulatory vocabulary:
       RBI master direction, PSS Act, KYC guidelines, AFA compliance,
       TAT harmonisation, dispute resolution, liability framework

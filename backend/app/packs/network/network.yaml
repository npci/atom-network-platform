# Repository topology. The network spans TWO repos: the framework/XSD "core" and the
# "app" (2.0) that consumes it. This is declared rather than assumed because the
# rule used to live hardcoded in the SPA (AnalysisPanel/XSD "exactly one core and
# one app"); the server-side gate never enforced it at all. With the client now
# deriving its rule from here, an undeclared topology means "no constraint" — so
# omitting this block would silently drop the network's two-repo guarantee, letting a run
# start with only the app repo and no framework/XSD in the workspace.
#
# builds_first on core: verification_plan bootstraps a full-reactor `mvn install`
# of every builds_first repo before per-module builds, so the app compiles against
# the freshly built framework jar rather than a stale one from .m2.
#
# NOTE: these keys must match the `role` column on registered CodeRepo rows. A
# repo with a NULL or different role is now rejected at run creation with a 400
# naming the expected keys — fix it in Admin -> Code Indexing.
repo_roles:
- key: core
  label: Core / framework (XSD)
  required: true
  multiple: false
  builds_first: true
- key: app
  label: Application (2.0)
  required: true
  multiple: false
  builds_first: false

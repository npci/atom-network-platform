# Clarification gating + safe defaults (assumption_handler). Only concepts this
# pack actually declares: loan periods / renewals (hard_rules), recalls
# (ReqRecallNotify), loan limits (E003), reservations (RV / change_operations),
# patron data (compliance_levels patron-data-touched), member standing
# (GOOD|SUSPENDED), policy circulars (reference_kind). Anything NLLN has not
# stated a default for is deliberately omitted — the platform must not invent
# an assumption for this domain.

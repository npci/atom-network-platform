# Repository topology. NLLN ships as ONE git repo (NirbhayN/nllm-fixtures) holding
# three Maven modules — nlln-contract, nllc-authority, anna-library — so it declares
# a single role, whose key matches the registered CodeRepo row's `role`.
#
# builds_first: true is load-bearing, not decoration. Both nllc-authority and
# anna-library declare a dependency on in.nlln:nlln-contract:1.0.0, so a change to
# the contract module (e.g. CR-1's Book.language) must be installed to the local
# .m2 before its consumers compile. Without this, verification_plan builds only the
# touched modules and the consumers resolve a STALE contract jar. Setting it forces
# a full-reactor `mvn install`, which builds contract -> authority -> library in
# dependency order.
repo_roles:
- key: app
  label: NLLN fixture (contract + authority + participant modules in one repo)
  required: true
  multiple: false
  builds_first: true

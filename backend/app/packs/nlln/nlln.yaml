# The shape of an NLLN error code, for the "does this document actually name
# codes?" document checks. Read off the fixture contract, not off this pack's
# own hard_rules prose: nlln-contract/.../ErrorCode.java defines E001-E008 (CR-1
# adds E009) and the NLLC switch contributes L-prefixed codes such as L16.
# NOTE: prompt_blocks.hard_rules above still tells the model codes MUST be
# L01-L99 / C0-C9 / RV / XL. C0-C9, RV and XL appear NOWHERE in the contract.
# That contradiction is logged, not silently reconciled here — changing the
# hard rule changes generated document CONTENT, which is a separate call.
error_code_pattern: \b(?:E\d{3}|L\d{2})\b

# NLLN is an XML ecosystem (nlln-v1.xsd, namespace http://nlln.in/schema/v1).
# Declared explicitly rather than left to cert_case_builder's `or "xml"` fallback,
# so the round records a stated fact instead of a coincidental default.
wire_format: xml

# NLLN certifies through the platform's pack-driven simulator. The string names
# a harness the PLATFORM registers (app/services/cert_harnesses.py) — config
# supplies the name, the platform supplies the behaviour. Scope, templates and
# assertions all derive from the API registry + published sim packs, so the
# engine carries no payments assumptions. Omit this key entirely for a domain
# with no certification body.
certification_harness: sim_pack

# NLLN distributes changes to participant libraries over the platform's A2A
# transport — the same signed, authenticated wire UPI uses. The string names a
# channel the PLATFORM registers (app/services/partner_channels.py); config
# names it, the platform supplies it. Omit for a publish-and-notify domain.
partner_channel: a2a

# The shape of an NLLN wire message NAME. Req*/Resp* PascalCase is a stated
# hard rule of this pack; the contract defines no synchronous Ack, so — unlike
# UPI — no Ack alternative is declared.
message_name_pattern: \b(?:Req|Resp)[A-Z][A-Za-z0-9]+\b

# No `message_flows`: NLLN certifies through the pack-driven simulator, not
# cert-agent's flow registry, so there is no baseline API->flow table to
# declare. An unmapped stub surfaces as an unknown API instead of guessing.

# Heuristic FR-tagging regexes over this pack's own change_operations and
# cert parties. Tags are advisory (the planner works untagged), so these are
# deliberately simple; a miss tags nothing.
operation_patterns:
  reserve: \b(reserv(?:e|es|ed|ing|ation)|place (?:a )?hold)\b
  issue: \b(issu(?:e|es|ed|ing) (?:the )?(?:item|loan|book)|check(?:s|ed)?[- ]?out|lend(?:s|ing)?)\b
  renew: \b(renew(?:al|s|ed|ing)?)\b
  close: \b(clos(?:e|es|ed|ing) (?:the )?loan|return(?:s|ed|ing)? (?:the )?(?:item|book)|reqloanclose)\b
party_patterns:
  LENDING_LIBRARY: \b(lending\s+librar(?:y|ies))\b
  BORROWING_LIBRARY: \b(borrowing\s+librar(?:y|ies))\b

# No `financial_operations`: NLLN moves no money, so every flow legitimately
# classifies as "meta".

# Loose party spellings -> canonical party keys.
party_aliases:
  LENDER: LENDING_LIBRARY
  LENDING: LENDING_LIBRARY
  BORROWER: BORROWING_LIBRARY
  BORROWING: BORROWING_LIBRARY

# Ecosystem acronyms an error-code-shaped scan must not mistake for codes.
domain_acronyms:
- NLLC
- NLLN
- ISBN

# No `schema_namespaces`: the contract binds exactly one namespace
# (http://nlln.in/schema/v1) with no variant spellings to reconcile.

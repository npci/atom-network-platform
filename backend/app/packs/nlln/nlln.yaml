key: nlln
version: '1.0'
prompt_blocks:
  hard_rules: '# NLLN LIBRARY-LOAN DOCUMENT HARD RULES (must follow; violations fail review)


    ## Error Codes

    - All loan-protocol error codes MUST use the NLLN alphanumeric format: L01-L99 (loan-state errors),
    C0-C9 (catalogue/holdings errors), RV (reservation conflict), XL (loan-limit exceeded).

    - NEVER use HTTP status codes (400, 401, 403, 404, 500, 502, 503) for loan-protocol errors.

    - Every error code MUST be classified as "SE" (System Error) or "PD" (Policy Decline). Never "error",
    "failure", or other free-form labels.

    - Every error code row MUST identify the responsible entity: Participant Library / NLLC / Lending
    Library / Borrowing Library.


    ## Functional Requirements

    - Every BRD/Tech Spec functional requirement MUST be numbered FR-01, FR-02, FR-03, ... (zero-padded
    to 2 digits).

    - A BRD must have at least 6 functional requirements.

    - Each FR must be a single declarative sentence beginning with "The system shall", "NLLC shall", "Participant
    Library must", or a similar explicit subject.


    ## Obligation Language

    - Use active obligation verbs: "NLLC shall", "Participant Library must", "Lending Library shall",
    "The system shall".

    - NEVER use vague phrasing: "the system will", "ideally", "should probably", "in some cases".

    - Every flow step must name the responsible actor (Lending Library / NLLC / Borrowing Library / Patron).


    ## Placeholders

    - Final output must contain ZERO placeholder text. Never emit: "TBD", "TODO", "XXX", "<placeholder>",
    "N/A" (unless truly not applicable and stated so), "lorem ipsum".

    - If a detail is genuinely unknown, state the assumption explicitly with an "Assumption:" prefix.


    ## Loan Periods & Limits

    - Use a structured duration (numeric value + unit) for loan periods (e.g., "14 days"), never a bare
    unqualified number.

    - Renewal counts and reservation queue lengths are integers; state the unit explicitly.


    ## API & Field Naming

    - Request API names use the form "ReqXxxYyy" (PascalCase after Req).

    - Response API names use the form "RespXxxYyy".

    - Field names use camelCase (e.g., patronId, loanPeriod), never snake_case or PascalCase.

    - Every field row must specify: type, mandatory (Y/N), dLength, description.


    ## XSD / Schema

    - XSD element names use PascalCase (e.g., <LoanPeriod>).

    - XSD attributes use camelCase.

    - All duration/count fields use xs:decimal or xs:integer with explicit restrictions; never xs:string
    for numeric values.

    '
  api_design_principles: ''
  error_codes: '## Example error codes (reference only — use ones relevant to the feature)

    | Code | se_pd | Entity | Description |

    |------|-------|--------|-------------|

    | L09  | SE    | Participant Library | Invalid patron identifier |

    | L16  | SE    | NLLC   | Catalogue lookup timeout |

    | C30  | PD    | Lending Library | Item not available for loan |

    | RV   | PD    | NLLC   | Reservation conflict — item already held |

    | XL   | PD    | Participant Library | Patron loan limit exceeded |

    '
  authority: NLLC
  evidence_sources: NLLC / Library Consortium Policy
  evidence_heading: Retrieved NLLC corpus evidence
  citation_example: Participant libraries must confirm a hold within 48h [S2].
  reference_kind: policy circular
  claim_kinds: consortium policy obligation, error-code, API name, or SLA claim
  document_register: NLLC-governed specification document
  platform_name: the NLLC Library-Loan Change Management Platform
  domain_name: NLLN
  ecosystem_description: NLLC operates the inter-library loan switch connecting member libraries so patrons
    can borrow items held by any participant.
  ecosystem_actors: member libraries, NLLC, patrons
  compliance_note: Any new library-loan feature must comply with NLLC consortium policy and be backward-compatible
    with the existing participant network (lending libraries, borrowing libraries).
  regulatory_body: NLLC
  market_comparables: comparable library consortia and ILS vendors (Ex Libris, OCLC, Koha, etc.)
  market_context: the inter-library resource-sharing context
  product_operating_extra: ''
  regulatory_claim_label: NLLC policy circular
  numbered_citation_example: The standard loan period is 14 days for most participants [3].
  corpus_label: NLLC corpus
  # Certification-workbook display labels (excel_testcase_engine). These are
  # LABELS ONLY — the wire value stays "Bank"/"NPCI" for cert-agent; see
  # workbook_plan.TestCaseStub.txn_initiated_by.
  test_case_scope: NLLN v1
  initiator_authority_label: NLLC
  initiator_participant_label: Participant Library
  role_as_label: Library as
  # Ecosystem knowledge spliced into every docgen planner/writer prompt via
  # `_PACK_DOMAIN_NOTES`. Before this key existed the docgen pipeline handed the
  # model UPI's participants and REQ_PAY flow regardless of the active pack, which
  # is why a library-domain TSD still said "No new NPCI wire codes".
  #
  # Every fact below is read off the fixture contract
  # (nlln-contract/src/main/resources/xsd/nlln-v1.xsd and ErrorCode.java) — the
  # message list, the namespace binding, the result values and the E001–E008 codes
  # are verbatim from source, not paraphrased. Do not add a code or message here
  # that the schema does not define: this block is stated to the model as fact and
  # it will be cited as such.
  docgen_generic_domain_notes: |-

    ═══════════════════════════════════════════════════════════
    NLLN DOMAIN KNOWLEDGE — USE ALL YOU HAVE; KEY FACTS BELOW
    ═══════════════════════════════════════════════════════════
    ECOSYSTEM PARTICIPANTS:
      · NLLC — National Library Lending Council. Operates the inter-library loan
        switch and issues the specifications. The authority.
      · Lending Library — holds the physical copy; answers availability and lends it.
      · Borrowing Library — requests the item on behalf of its patron.
        "Lending" and "borrowing" are ROLES a member library takes per loan, not
        separate organisations; one participant can act as either.
      · Patron — the end borrower. Never speaks the wire protocol directly.

    WIRE MESSAGE TYPES (all of them — the contract defines no others):
      · ReqMemberVerify / RespMemberVerify — confirm a patron handle, standing
        (GOOD|SUSPENDED) and active-vs-maximum loan counts.
      · ReqAvailabilityCheck / RespAvailabilityCheck — ask a library whether a copy
        of an ISBN is on the shelf.
      · ReqLoanReport / RespLoanReport — report a loan into NLLC and open it.
      · ReqLoanClose / RespLoanClose — return / close out an open loan.
      · ReqRecallNotify / RespRecallNotify — recall an item before its due date.

    SCHEMA AND WIRE FORM:
      · Namespace http://nlln.in/schema/v1, bound as the DEFAULT namespace
        (xmlns="…") — the contract binds no prefix, so samples are unprefixed.
      · Every response carries Resp.result; the only permitted values are
        SUCCESS and FAILURE.
      · Shared types: Head, Member, Book, Loan, Resp, ErrorCode.

    ERROR CODES (flat E-series; the enum defines exactly these eight):
      · E001 Unknown member handle
      · E002 Member is suspended
      · E003 Member has reached the concurrent loan limit
      · E004 No copy of this ISBN is available at the library
      · E005 Unknown loan reference
      · E006 Loan is not in a state that permits this transition
      · E007 Unknown or unregistered participant orgId
      · E008 Malformed request

    CHANGE CLASSIFICATION (the NLLC rulebook, stated in the contract header):
      · ADDITIVE — optional attribute/element added. No recertification.
      · BEHAVIOURAL — same schema, changed validation rule. Recertification REQUIRED.
      · BREAKING — type change, removal, or cardinality change. New namespace plus a
        coexistence window.
      Classify against these definitions, not by whether the change "feels" small:
      adding an optional field but also rejecting values that were previously
      accepted is BEHAVIOURAL, because a validation rule changed.
  # Domain retrieval vocabulary appended by app/rag/query_rewriter.py to its
  # (neutral) system prompt under a "Domain vocabulary" heading. Every message
  # name and error code below is read off the fixture contract facts already
  # stated in docgen_generic_domain_notes — nothing here is invented beyond
  # this file's own facts.
  retrieval_domain_expertise: |-
    You are an NLLC inter-library-loan domain expert. The corpus holds NLLC
    policy circulars, consortium policy documents, past BRDs/TSDs, API specs,
    XSD schemas, error codes, FAQs, and certification testcases.

    1. Expand informal/casual terms to official NLLC terms:
       - "borrow" / "check out" -> "loan issue", "loan report", "open loan"
       - "hold" / "book a copy" -> "reservation", "reserve (place a hold)"
       - "give back" / "hand in" -> "loan close", "return", "close out an open loan"
       - "extend" / "auto-renew" -> "loan renewal", "renew (extend an active loan)"
       - "call back a book" -> "recall", "recall an item before its due date"
       - "is it on the shelf" -> "availability check", "copy availability by ISBN"

    2. Include relevant NLLN wire message names where obviously applicable:
       ReqMemberVerify, RespMemberVerify, ReqAvailabilityCheck,
       RespAvailabilityCheck, ReqLoanReport, RespLoanReport, ReqLoanClose,
       RespLoanClose, ReqRecallNotify, RespRecallNotify

    3. Include relevant error codes where obviously applicable:
       E001 (unknown member handle), E002 (member suspended), E003 (concurrent
       loan limit reached), E004 (no copy available), E005 (unknown loan
       reference), E006 (illegal loan-state transition), E007 (unknown
       participant orgId), E008 (malformed request)

    4. Include consortium policy vocabulary:
       NLLC policy circular, consortium policy, participant library, lending
       library, borrowing library, patron standing, loan period, recall,
       ADDITIVE / BEHAVIOURAL / BREAKING change classification
  # ── Docgen genericisation sweep: library-domain equivalents of the docgen ──
  # vocabulary that used to be hardcoded (UPI-flavoured) in

  infosec_domain_notes: |-
    ## NLLC-Specific Security Standards
    - No hardcoded secrets, API keys, passwords, or tokens anywhere in code
    - No patron PII (name, contact details, patron identifiers, borrowing history) logged in plain text
    - All external communication must enforce TLS (no http:// URLs for APIs)
    - Input validation on all loan-protocol fields (patron identifiers, ISBN format, loan periods and counts)
    - Loan periods and renewal counts must be handled as integers with explicit units, never floating-point
    - No sensitive data in URL query parameters
    - Proper use of CSRF tokens for state-changing operations
    - Secure random number generation (SecureRandom, not Random)

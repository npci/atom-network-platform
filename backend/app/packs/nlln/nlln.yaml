  docgen_ownership_roles: |-
    OWNERSHIP MODEL — DOMAIN ROLE RESPONSIBILITIES (extends the layer model in the rules above):
      · Lending Library = holdings truth, availability responses, lends the item.
      · Borrowing Library = patron requests, loan initiation on behalf of its patron.
      · NLLC = routing/aggregation, member registry.
  docgen_envisaged_changes_role_label: Lending Library
  docgen_envisaged_changes_role_responsibilities: holdings truth, availability responses, and lending
